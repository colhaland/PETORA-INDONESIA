name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, sqlite, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database && touch database/database.sqlite
      - name: Code style (Pint, dry-run)
        run: ./vendor/bin/pint --test
      - name: Run tests
        run: php artisan test --compact

# PostgreSQL constraint/migration check (expand as PG-specific tests are added)
  test-pgsql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: petora_test
          POSTGRES_USER: petora
          POSTGRES_PASSWORD: petora
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U petora -d petora_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pgsql, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: petora_test
          DB_USERNAME: petora
          DB_PASSWORD: petora
        run: php artisan migrate:fresh --force

