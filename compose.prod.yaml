name: petora

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${PETORA_DOTENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres-ca.crt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tls
      REDIS_SSL_CA: /run/secrets/redis-ca.crt
      REDIS_CACHE_URL: rediss://redis:6379/1
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - backend
    secrets:
      - postgres-ca
      - redis-ca
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.50
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${PETORA_DOTENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres-ca.crt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tls
      REDIS_SSL_CA: /run/secrets/redis-ca.crt
      REDIS_CACHE_URL: rediss://redis:6379/1
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - backend
    secrets:
      - postgres-ca
      - redis-ca
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${PETORA_DOTENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres-ca.crt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tls
      REDIS_SSL_CA: /run/secrets/redis-ca.crt
      REDIS_CACHE_URL: rediss://redis:6379/1
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - backend
    secrets:
      - postgres-ca
      - redis-ca
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres-server.crt
      - -c
      - ssl_key_file=/run/secrets/postgres-server.key
      - -c
      - ssl_ca_file=/run/secrets/postgres-ca.crt
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    secrets:
      - postgres-ca
      - postgres-server-cert
      - postgres-server-key
    networks:
      - backend
    mem_limit: 1g
    cpus: 2.00
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/secrets/redis-server.crt
      - --tls-key-file
      - /run/secrets/redis-server.key
      - --tls-ca-cert-file
      - /run/secrets/redis-ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    secrets:
      - redis-ca
      - redis-server-cert
      - redis-server-key
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --tls --cacert /run/secrets/redis-ca.crt -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backup:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-backup:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres-ca.crt
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
    command: ["sh", "-c", "while true; do /usr/local/bin/backup-postgres.sh; sleep 86400; done"]
    volumes:
      - backups:/backups
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    secrets:
      - postgres-ca
      - backup-encryption-key
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  storage:
  bootstrap_cache:
  backups:
  caddy_data:
  caddy_config:

secrets:
  postgres-ca:
    file: ${POSTGRES_CA_CERT:?Set POSTGRES_CA_CERT}
  postgres-server-cert:
    file: ${POSTGRES_SERVER_CERT:?Set POSTGRES_SERVER_CERT}
  postgres-server-key:
    file: ${POSTGRES_SERVER_KEY:?Set POSTGRES_SERVER_KEY}
  redis-ca:
    file: ${REDIS_SSL_CA_CERT:?Set REDIS_SSL_CA_CERT}
  redis-server-cert:
    file: ${REDIS_SSL_SERVER_CERT:?Set REDIS_SSL_SERVER_CERT}
  redis-server-key:
    file: ${REDIS_SSL_SERVER_KEY:?Set REDIS_SSL_SERVER_KEY}
  backup-encryption-key:
    file: ${BACKUP_ENCRYPTION_KEY_FILE:?Set BACKUP_ENCRYPTION_KEY_FILE}
